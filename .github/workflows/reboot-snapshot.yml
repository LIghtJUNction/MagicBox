name: Reboot Source
on:
  push:
    branches: [codex/token-cloud-reboot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git archive --format=zip -o MagicBox-source.zip HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reboot-source
          path: MagicBox-source.zip
          retention-days: 3
