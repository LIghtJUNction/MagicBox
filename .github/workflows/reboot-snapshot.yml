name: Reboot Source
on:
  push:
    branches: [codex/token-cloud-reboot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip -o MagicBox-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reboot-source
          path: MagicBox-source.zip
          retention-days: 3
