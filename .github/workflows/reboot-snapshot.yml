name: Reboot Source
on:
  push:
    branches: [codex/token-cloud-reboot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git archive --format=zip -o MagicBox-source.zip HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reboot-source
          path: MagicBox-source.zip
          retention-days: 3
