name: Token Cloud
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: token-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    uses: ./.github/workflows/runtime.yml
  validate:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: runtime-input
      - name: Validate and stage universal-only components
        run: python3 scripts/stage-runtime.py --input runtime-input
      - name: Offline native integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          chmod +x runtime-input/runtime-linux-x86_64/*.so
          python3 scripts/test_runtime.py --runtime-dir runtime-input/runtime-linux-x86_64 2>&1 | tee evidence/native-tests.log
      - name: Check APK and promotion contracts
        run: |
          python3 -m unittest scripts/test_verify_apks.py scripts/test_stage_runtime.py
          python3 scripts/test-prepare-alpha.py
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test both editions and build installable test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:testUniversalDebugUnitTest :app:testUiDebugUnitTest :app:assembleUniversalDebug :app:assembleUiDebug :app:assembleUniversalDebugAndroidTest :app:assembleUiDebugAndroidTest --stacktrace
      - name: Verify packages, signatures and component isolation
        run: python3 scripts/verify-apks.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-validation
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
            app/build/test-results/
            evidence/
          if-no-files-found: error
  device:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-validation
          path: validated
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_visual.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-device-evidence
          path: evidence/device/
          if-no-files-found: error
