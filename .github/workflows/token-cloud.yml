name: Token Cloud
on:
  push:
    branches: [codex/token-cloud-reboot]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: token-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source snapshot
        run: git archive --format=zip -o MagicBox-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: MagicBox-source.zip
          retention-days: 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
