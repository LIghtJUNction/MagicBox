name: MagicBox reboot verification
on:
  workflow_call:
  push:
    branches: [feat/token-cloud-reboot-20260916]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reboot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    uses: ./.github/workflows/runtime.yml
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD > MagicBox-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: MagicBox-source
          path: MagicBox-source.tar.gz
          retention-days: 14
  build:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: magicbox-preview-test-signing-v1
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: runtime-input
      - name: Assemble native packages and licenses
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            (cd "runtime-input/runtime-$abi" && sha256sum -c SHA256SUMS)
            mkdir -p "app/runtime/jniLibs/$abi"
            cp "runtime-input/runtime-$abi/"*.so "app/runtime/jniLibs/$abi/"
          done
          mkdir -p app/runtime/assets/licenses
          cp runtime-input/runtime-arm64-v8a/*LICENSE app/runtime/assets/licenses/
          cp runtime.lock.json app/runtime/assets/
          cp LICENSE app/runtime/assets/licenses/MagicBox-LICENSE
          chmod +x gradlew
      - name: Offline native integration
        run: |
          set -o pipefail
          chmod +x runtime-input/runtime-linux-x86_64/*.so
          python3 scripts/test_runtime.py --runtime-dir runtime-input/runtime-linux-x86_64 2>&1 | tee native-tests.log
      - name: Unit tests and dual package build
        run: |
          set -o pipefail
          ./gradlew :app:testUniversalDebugUnitTest :app:testControllerDebugUnitTest :app:assembleUniversalDebug :app:assembleControllerDebug :app:assembleUniversalDebugAndroidTest :app:assembleControllerDebugAndroidTest --stacktrace 2>&1 | tee build.log
      - name: Verify co-installable signed APKs
        run: |
          set -euo pipefail
          mkdir -p delivery
          for flavor in universal controller; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "delivery/$flavor-signature.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "delivery/$flavor-package.txt"
            cp "$apk" "delivery/MagicBox-0.2.0-alpha.1-$flavor-preview-debug.apk"
          done
          grep -F "package: name='com.github.lightjunction.magicbox'" delivery/universal-package.txt
          grep -F "package: name='com.github.lightjunction.magicbox.ui'" delivery/controller-package.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          packages = {flavor: zipfile.ZipFile(next(Path('delivery').glob(f'*{flavor}*.apk'))) for flavor in ('universal','controller')}
          assert not any(n.rsplit('/',1)[-1] in ('libsingbox.so','libproxylink.so','libebpfcheck.so') for n in packages['controller'].namelist())
          for abi in ('arm64-v8a','x86_64'):
              for lib in ('libsingbox.so','libproxylink.so','libebpfcheck.so'):
                  assert f'lib/{abi}/{lib}' in packages['universal'].namelist()
          PY
          cp docs/REBOOT.md runtime.lock.json delivery/
          (cd delivery && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: MagicBox-preview-apks
          path: delivery
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MagicBox-instrumentation-inputs
          path: app/build/outputs/apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MagicBox-build-report
          path: |
            build.log
            native-tests.log
            app/build/reports/tests
            app/build/test-results
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MagicBox-instrumentation-inputs
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set -e
            mkdir -p visual
            for flavor in universal controller; do
              adb install "apks/$flavor/debug/app-$flavor-debug.apk"
              adb install "apks/androidTest/$flavor/debug/app-$flavor-debug-androidTest.apk"
              package=com.github.lightjunction.magicbox
              if [ "$flavor" = controller ]; then package=$package.ui; fi
              adb shell am instrument -w -e class com.github.lightjunction.magicbox.CloudVisualTest "$package.test/androidx.test.runner.AndroidJUnitRunner" | tee "visual/$flavor-instrumentation.txt"
              adb pull "/sdcard/Android/data/$package/files/." visual/
              grep -E 'OK \([1-9][0-9]* tests?\)' "visual/$flavor-instrumentation.txt"
            done
            adb shell am instrument -w -e class com.github.lightjunction.magicbox.NativeRuntimeIntegrationTest com.github.lightjunction.magicbox.test/androidx.test.runner.AndroidJUnitRunner | tee visual/native-runtime-instrumentation.txt
            adb pull /sdcard/Android/data/com.github.lightjunction.magicbox/files/. visual/
            grep -E 'OK \([1-9][0-9]* tests?\)' visual/native-runtime-instrumentation.txt
            adb shell dumpsys gfxinfo com.github.lightjunction.magicbox > visual/emulator-gfxinfo.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MagicBox-native-visual-proof
          path: visual
          if-no-files-found: error
