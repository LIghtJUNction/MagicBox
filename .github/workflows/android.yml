name: Android
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    name: UI-only unit tests and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:testUiDebugUnitTest :app:assembleUiDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-compilation
          path: |
            app/build/outputs/apk/ui/debug/*.apk
            app/build/reports/tests/testUiDebugUnitTest/
          if-no-files-found: warn
