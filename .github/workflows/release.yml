name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/reboot.yml
  release-gate:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Preview artifacts are attached to this run. Stable publishing requires configured signing and physical root-device acceptance.'
          echo 'Never upload unsigned APKs or label debug-signed previews as production releases.'
