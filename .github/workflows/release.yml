name: Release reviewed Token Cloud
on:
  push:
    branches: [publish/token-cloud-reviewed-20260917]
    paths: [.github/release-request.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: magicbox-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'LIghtJUNction/MagicBox'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read explicit visual approval
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path=Path('.github/release-request.json')
          assert path.stat().st_size < 16384
          request=json.loads(path.read_text())
          assert request['visually_reviewed'] is True
          fields={'RUN_ID':str(request['validated_run']), 'REVIEWED_SHA':request['reviewed_sha'], 'HEAD_SHA':request['head_sha'], 'RELEASE_TAG':request['tag']}
          assert re.fullmatch(r'[0-9]+',fields['RUN_ID'])
          assert all(re.fullmatch(r'[0-9a-f]{40}',fields[k]) for k in ('REVIEWED_SHA','HEAD_SHA'))
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+',fields['RELEASE_TAG'])
          with open(os.environ['GITHUB_ENV'],'a') as env:
              for key,value in fields.items(): env.write(f'{key}={value}\n')
          PY
      - name: Verify immutable successful source and device run
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$REVIEWED_SHA" > reviewed.json
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" > head.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['name']=='Token Cloud' and run['path']=='.github/workflows/token-cloud.yml'
          assert run['head_sha']==os.environ['HEAD_SHA']
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['event'] in ('push','pull_request') and run['head_branch'] in ('main','codex/token-cloud-reboot')
          jobs=json.load(open('jobs.json'))['jobs']
          assert all(any(j['name']==name and j['conclusion']=='success' for j in jobs) for name in ('native','validate','device'))
          # PR jobs compile a merge ref. Require its complete tree to equal
          # the approved feature head, not just a related parent or branch name.
          reviewed=json.load(open('reviewed.json')); head=json.load(open('head.json'))
          assert reviewed['sha']==os.environ['REVIEWED_SHA'] and head['sha']==os.environ['HEAD_SHA']
          assert reviewed['tree']['sha']==head['tree']['sha']
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
      - name: Download the selected immutable artifacts
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-validation --dir validated
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-device-evidence --dir device
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name native-evidence --dir native-evidence
      - name: Verify exact APK bytes and inspected screenshots
        run: |
          python3 scripts/test-prepare-alpha.py
          python3 scripts/verify-visual-approval.py
          python3 scripts/prepare-alpha.py --sha "$REVIEWED_SHA" --tag "$RELEASE_TAG"
          cp .github/release-request.json release/visual-approval.json
          cp device/universal-tests.txt device/ui-tests.txt release/
      - name: Include corresponding pinned dependency source
        run: |
          set -euo pipefail
          mkdir dependencies-source
          revision=a94682e4a4d2c187b3f2ad7e0107f7d1ad4323cd
          gh api "repos/LIghtJUNction/MagicNet/zipball/$revision" > dependencies-source/MagicNet.zip
          core=$(gh api "repos/LIghtJUNction/MagicNet/contents/sing-box?ref=$revision" --jq .sha)
          [[ "$core" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/LIghtJUNction/sing-box/zipball/$core" > dependencies-source/sing-box.zip
          gh api repos/Fanju6/Proxylink/zipball/44929c0984944870297c260dc43a4aa9262f9e1c > dependencies-source/Proxylink.zip
          tar -czf "release/MagicBox-$RELEASE_TAG-dependencies-source.tar.gz" dependencies-source
          tar -czf "release/MagicBox-$RELEASE_TAG-evidence.tar.gz" device native-evidence
          (cd release && sha256sum * > SHA256SUMS)
      - name: Upload a draft and verify every uploaded digest before publishing
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## MagicBox · Token 云集合

          两个可同时安装的 Alpha 测试版本：
          - **universal 通用版**：`com.github.lightjunction.magicbox`，内置 sing-box、订阅转换器、运行监督组件，不依赖 MagicNet 模块。包含 arm64-v8a / x86_64。
          - **ui 界面版**：`com.github.lightjunction.magicbox.ui`，不包含代理内核，必须明确授予 Root 并安装、启用兼容的 MagicNet 模块。

          本次为经过测试的原始 APK，不重新构建、不重新签名。两版使用 CI 测试签名（debug），不是长期生产签名；旧测试包证书不同时无法直接覆盖安装，卸载前请先保存订阅与设置。

          已完成两版各 91 项单元测试、内核组件隔离和签名校验、Android 35 模拟器双包安装、通用版真实 socket 转发、停止、错误导入保留、真实手指拖动、搜索分页与十二张明暗界面截图检查。拖动控制权从画布转给容器不再提前结束动画；静止和按住不动时不继续重绘。证据、校验和及对应源码附在下方。

          **使用边界：** 系统代理提供 `127.0.0.1:2080` 的 HTTP / SOCKS 服务，需要在 Wi-Fi 或支持代理的应用中手动配置，不是全设备 VPN。TUN 需要 Root；eBPF 还需要支持的内核与设备能力。Root 真机 TUN/eBPF、已安装 MagicNet 的完整联调、切网与休眠恢复、实机帧率和功耗尚未完成验收，不能以模拟器测试替代。

          订阅在本机转换，不提交给第三方转换站。常见格式覆盖见源码测试；未知格式及不支持的扩展明确报错，不声称兼容所有私有格式。两个应用可同装，但不要同时开启全设备透明代理。
          NOTES
          printf '\n验证运行：https://github.com/%s/actions/runs/%s\n功能提交：%s\n实际编译源码：%s\n' "$GITHUB_REPOSITORY" "$RUN_ID" "$HEAD_SHA" "$REVIEWED_SHA" >> notes.md
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$REVIEWED_SHA" --title "MagicBox $RELEASE_TAG · Token Cloud" --notes-file notes.md --prerelease --latest=false --draft
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > uploaded.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          assets={a['name']:a for a in json.load(open('uploaded.json'))['assets']}
          for path in Path('release').iterdir():
              if path.is_file():
                  assert path.name in assets
                  assert assets[path.name]['size']==path.stat().st_size
                  assert assets[path.name]['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
