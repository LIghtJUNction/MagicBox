name: Release
on:
  workflow_dispatch:
    inputs:
      validated_run:
        description: Successful Token Cloud push-run ID
        required: true
        type: string
      reviewed_sha:
        description: Exact 40-character commit reviewed with its device screenshots
        required: true
        type: string
      tag:
        description: Alpha version already embedded in the verified APKs
        default: v0.2.0-alpha.1
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: magicbox-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.validated_run }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
      - name: Verify immutable validation run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['head_sha']==os.environ['REVIEWED_SHA']
          assert run['event']=='push' and run['path']=='.github/workflows/token-cloud.yml'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] in ('main','codex/token-cloud-reboot')
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite tested artifacts.' >&2
            exit 1
          fi
      - name: Download only the selected run artifacts
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-validation --dir validated
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-device-evidence --dir device
      - name: Check exact bytes and prepare both editions
        run: |
          python3 scripts/test-prepare-alpha.py
          python3 scripts/prepare-alpha.py --sha "$REVIEWED_SHA" --tag "$RELEASE_TAG"
      - name: Include pinned dependency sources and validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir dependencies-source
          revision=a94682e4a4d2c187b3f2ad7e0107f7d1ad4323cd
          gh api "repos/LIghtJUNction/MagicNet/zipball/$revision" > dependencies-source/MagicNet.zip
          core=$(gh api "repos/LIghtJUNction/MagicNet/contents/sing-box?ref=$revision" --jq .sha)
          [[ "$core" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/LIghtJUNction/sing-box/zipball/$core" > dependencies-source/sing-box.zip
          gh api repos/Fanju6/Proxylink/zipball/44929c0984944870297c260dc43a4aa9262f9e1c > dependencies-source/Proxylink.zip
          tar -czf "release/MagicBox-$RELEASE_TAG-dependencies-source.tar.gz" dependencies-source
          tar -czf "release/MagicBox-$RELEASE_TAG-device-evidence.tar.gz" device
          (cd release && sha256sum * > SHA256SUMS)
      - name: Publish Alpha, never unsigned or untested builds
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          MagicBox Token Cloud Alpha — two co-installable test editions.

          Universal: com.github.lightjunction.magicbox — bundled sing-box, converter and supervised runtime; arm64-v8a + x86_64.
          UI: com.github.lightjunction.magicbox.ui — root + an enabled compatible MagicNet module are mandatory. No proxy core is bundled.

          These are the exact signed test APKs from the successful Android 35 emulator validation. UI screenshots, socket proxy transfer, stop behavior, failed-import retention and package isolation are included in the evidence archive. CI test signing is not the future stable release key; a later differently signed test build may require uninstalling the older test build first.

          System proxy provides HTTP/SOCKS on 127.0.0.1:2080; configure Wi-Fi or supported apps manually. It is not a VPN. Rooted physical-device TUN/eBPF, network switching and sleep recovery remain experimental and have not been certified by emulator tests. Subscription formats are explicitly enumerated in README; unknown extensions fail rather than being silently dropped.
          NOTES
          printf '\nValidated commit: %s\nValidation run: https://github.com/%s/actions/runs/%s\n' "$REVIEWED_SHA" "$GITHUB_REPOSITORY" "$RUN_ID" >> notes.md
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$REVIEWED_SHA" --title "MagicBox $RELEASE_TAG · Token Cloud" --notes-file notes.md --prerelease --latest=false --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
