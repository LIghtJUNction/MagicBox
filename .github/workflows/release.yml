name: Release reviewed alpha
on:
  push:
    branches: [release/token-cloud-verified]
    paths: [release/approval.json, scripts/finalize-reviewed.py, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: magicbox-reviewed-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'LIghtJUNction/MagicBox' && github.ref == 'refs/heads/release/token-cloud-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify promotion guards
        run: python3 scripts/test_publish_reviewed.py
      - name: Verify and finalize the exact existing draft by release ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/finalize-reviewed.py
      - name: Mark the unchanged validated implementation ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          approval=json.load(open('release/approval.json'))
          pr=json.loads(subprocess.check_output(['gh','pr','view','5','--repo','LIghtJUNction/MagicBox','--json','headRefOid,isDraft,state'],text=True))
          if pr['headRefOid']==approval['head_sha'] and pr['isDraft'] and pr['state']=='OPEN':
              subprocess.run(['gh','pr','ready','5','--repo','LIghtJUNction/MagicBox'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-release-record
          path: release-output/
          if-no-files-found: ignore
